name: Keep only OneKit container 0.6.1
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: onekit-container-cleanup
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve the 0.6.1 OCI graph and remove obsolete package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_container_versions.py

name: Checks
on:
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: ubuntu-latest, python: '3.15'}
          - {os: ubuntu-24.04-arm, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-11-arm, python: '3.13'}
          - {os: macos-15, python: '3.13'}
          - {os: macos-15-intel, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test
      - run: uv run --no-sync python scripts/check_contracts.py
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m compileall -q src
      - run: uv run --no-sync python -m onekit --version
  security-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test --extra signing --extra pdfa
      - run: uv pip install --python .venv/bin/python --no-deps pdfminer.six==20260107 pdftopdfa==0.9.24
      - run: uv run --no-sync python -m pytest tests/test_pdfa.py -q
      - run: uv export --locked --all-extras --no-emit-project --output-file .audit.txt
      - run: uv run --no-sync python -m pip_audit -r .audit.txt --no-deps --disable-pip --strict
      - run: uv run --no-sync python scripts/check_licenses.py --include-signing --include-pdfa
      - run: python scripts/check_node_licenses.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-inventory
          path: dependency-licenses.json
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.1
      - run: uv build
      - run: python scripts/check_distribution_licenses.py
      - run: uv venv .wheel-check
      - run: uv pip install --python .wheel-check/bin/python dist/*.whl
      - run: .wheel-check/bin/onekit list --json
      - run: docker build -t onekit-ci .
      - run: docker run --rm onekit-ci --version
      - run: docker run --rm --entrypoint python onekit-ci -c "import PIL,pypdf,pypdfium2,Crypto,docx,openpyxl"
  native-engines:
    runs-on: ubuntu-latest
    env:
      ONEKIT_NODE_ENGINE_PATH: ${{ github.workspace }}/.engines/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends ffmpeg ghostscript pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern libreoffice tesseract-ocr libimage-exiftool-perl fonts-dejavu-core
      - run: uv run --no-sync python -m onekit engines install
      - run: uv run --no-sync python -m pytest -q -m native
  required:
    if: always()
    needs: [compatibility, security-and-licenses, packaging, native-engines]
    runs-on: ubuntu-latest
    steps:
      - name: All mandatory checks must pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os; assert all(j['result']=='success' for j in json.loads(os.environ['RESULTS']).values())"

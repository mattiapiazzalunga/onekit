name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: ubuntu-latest, python: '3.15'}
          - {os: ubuntu-24.04-arm, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-11-arm, python: '3.13'}
          - {os: macos-15, python: '3.13'}
          - {os: macos-15-intel, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m compileall -q src
      - run: uv run --no-sync python -m onekit --version
  security-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test
      - run: uv export --locked --all-extras --no-emit-project --output-file .audit.txt
      - run: uv run --no-sync python -m pip_audit -r .audit.txt --no-deps --disable-pip --strict
      - run: uv run --no-sync python -m pip_audit -r browser/requirements.txt --no-deps --disable-pip --strict
      - run: uv run --no-sync python scripts/check_licenses.py
      - run: python scripts/check_node_licenses.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: license-inventory
          path: dependency-licenses.json
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.1
      - run: uv build
      - run: uv venv .wheel-check
      - run: uv pip install --python .wheel-check/bin/python dist/*.whl
      - run: .wheel-check/bin/onekit list --json
      - run: docker build -t onekit-ci .
      - run: docker run --rm onekit-ci --version
      - run: docker run --rm --entrypoint python onekit-ci -c "import PIL,pypdf,pypdfium2,Crypto,docx,openpyxl"
  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test
      - run: uv run --no-sync python scripts/export_browser.py .browser-test
      - run: uv run --no-sync python scripts/browser_fixtures.py .browser-test/fixtures.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
  native-engines:
    runs-on: ubuntu-latest
    env:
      ONEKIT_NODE_ENGINE_PATH: ${{ github.workspace }}/.engines/node
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra all --extra test
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends ffmpeg ghostscript pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern libreoffice tesseract-ocr libimage-exiftool-perl fonts-dejavu-core
      - run: uv run --no-sync python -m onekit engines install
      - run: uv run --no-sync python -m pytest -q -m native
  required:
    if: always()
    needs: [compatibility, security-and-licenses, packaging, browser-runtime, native-engines]
    runs-on: ubuntu-latest
    steps:
      - name: All mandatory checks must pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os; assert all(j['result']=='success' for j in json.loads(os.environ['RESULTS']).values())"

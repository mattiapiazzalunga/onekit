name: Feature request
description: Suggest a tool or improvement
body:
  - type: textarea
    id: need
    attributes: {label: What task should OneKit make simpler?}
    validations: {required: true}
  - type: textarea
    id: formats
    attributes: {label: Input/output formats and constraints, description: Include browser/CLI expectations and fidelity requirements.}
